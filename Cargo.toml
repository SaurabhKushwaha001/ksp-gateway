[package]
name = "ksp-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"
landlock = "=0.4.7"
seccompiler = "=0.5.0"
